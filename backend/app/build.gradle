plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    implementation 'io.javalin:javalin:7.1.0'
    implementation 'com.google.code.gson:gson:2.7'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    implementation 'org.postgresql:postgresql:42.7.4'

    // Javalin logs through SLF4J. Without a provider on the classpath SLF4J binds to a
    // no-op, so startup problems and request exceptions vanish silently -- which is how a
    // 500 from the old /rooms route reached production undiagnosed. runtimeOnly because
    // nothing compiles against it; the version tracks the slf4j-api Javalin pulls in.
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.aniguessr.App'
}

tasks.register('ingest', JavaExec) {
    group = 'application'
    description = 'Download, scrub and store the anime pool'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.aniguessr.IngestMain'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
