# Configuration for slf4j-simple, the logging provider Javalin writes through.
#
# Logs go to stdout rather than the default stderr so they interleave correctly with the
# application's own System.out output, and so hosting platforms collect them as ordinary
# output rather than flagging every line as an error.
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.defaultLogLevel=info

org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
# Class name only, not the full package -- the fully qualified names are long enough to
# push the actual message off the side of a terminal.
org.slf4j.simpleLogger.showShortLogName=true

# Jetty is chatty at info about connectors and sessions on every start.
org.slf4j.simpleLogger.log.org.eclipse.jetty=warn
